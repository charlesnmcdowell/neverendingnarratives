<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0a08;color:#d8cdb8;font-family:'Courier New',monospace}
  #bar{position:fixed;top:0;left:0;right:0;height:36px;display:flex;align-items:center;gap:14px;padding:0 12px;
       background:#0a0908;border-bottom:1px solid rgba(146,64,14,.4);font-size:12px;letter-spacing:1px;z-index:5}
  #bar a{color:#e7b450;text-decoration:none}
  #bar a:hover{text-decoration:underline}
  #bar .sp{flex:1}
  #bar .t{color:#e7b450;text-transform:uppercase;font-weight:bold;letter-spacing:3px}
  #bar .sub{color:#6b5d4f;font-style:italic}
  #game{position:fixed;top:36px;left:0;right:0;bottom:0;border:0;width:100%;height:calc(100% - 36px);background:#0b0a08}
  @media (max-width:640px){ #bar .sub{display:none} }
</style>
</head>
<body>
<div id="bar">
  <a href="/">&larr; Neverending Narratives</a>
  <span class="t">Adventurer</span>
  <span class="sub">a life, several times over</span>
  <span class="sp"></span>
  <a href="#" id="fs">&#x26F6; Fullscreen</a>
</div>
<!-- The game itself is served from its own repo (github.com/charlesnmcdowell/Adventure-Game) via GitHub Pages;
     this page keeps it on neverendingnarratives.com. Save data lives in the game's own origin. -->
<iframe id="game" src="https://charlesnmcdowell.github.io/Adventure-Game/" title="Adventurer" allow="fullscreen; autoplay" allowfullscreen></iframe>
<script>
  const f = document.getElementById('game');
  document.getElementById('fs').addEventListener('click', e => {
    e.preventDefault();
    (f.requestFullscreen || f.webkitRequestFullscreen || function(){ window.open(f.src, '_blank'); }).call(f);
  });
  // keyboard goes to the game, not this shell
  window.addEventListener('load', () => f.focus());
</script>
</body>
</html>
